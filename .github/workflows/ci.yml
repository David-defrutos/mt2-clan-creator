name: Creator checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build
      - run: npm run check:i18n
      - name: Load audited resources from tested Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $bundleDir = Join-Path $env:RUNNER_TEMP 'creator-release-fixture'
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          $found = $false
          for ($attempt = 0; $attempt -lt 24; $attempt++) {
            gh release download v0.1.0-beta.1 --pattern 'ClanCreator-win32-x64-2026-11-16-2040.zip' --dir $bundleDir --clobber
            if ($LASTEXITCODE -eq 0) { $found = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $found) { throw 'Tested release resources are unavailable.' }
          $zip = Join-Path $bundleDir 'ClanCreator-win32-x64-2026-11-16-2040.zip'
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fbf98ee92644b140c755fd38ffe918d3ff681228b3faedaa16cbedb864ff27cc') { throw 'Release resource hash mismatch.' }
          Expand-Archive -LiteralPath $zip -DestinationPath $bundleDir
          Copy-Item -LiteralPath (Join-Path $bundleDir 'ClanCreator/catalog/official') -Destination 'catalog/official' -Recurse
          New-Item -ItemType Directory -Path 'vendor' -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $bundleDir 'ClanCreator/vendor/modding') -Destination 'vendor/modding' -Recurse
      - run: npm test
