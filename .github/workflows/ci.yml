name: Creator checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - name: Load audited resources from tested Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $bundleDir = Join-Path $env:RUNNER_TEMP 'creator-release-fixture'
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          $found = $false
          for ($attempt = 0; $attempt -lt 24; $attempt++) {
            gh release download v0.1.0-beta.5 --pattern 'ClanCreator-0.1.0-beta.5-win32-x64-2026-11-21-2354.zip' --dir $bundleDir --clobber
            if ($LASTEXITCODE -eq 0) { $found = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $found) { throw 'Tested release resources are unavailable.' }
          $zip = Join-Path $bundleDir 'ClanCreator-0.1.0-beta.5-win32-x64-2026-11-21-2354.zip'
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c4c5d0dd04def79e866a4a285612862305dc8018600b13732736530bff723671') { throw 'Release resource hash mismatch.' }
          Expand-Archive -LiteralPath $zip -DestinationPath $bundleDir
          Copy-Item -LiteralPath (Join-Path $bundleDir 'ClanCreator/catalog/official') -Destination 'catalog/official' -Recurse
      - run: npm run build
      - run: npm run check:i18n
      - run: npm test
